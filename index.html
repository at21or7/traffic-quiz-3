<script>
const container = document.getElementById("container");
const PASS_LINE = 47;

let current = 0;
let score = 0;
let wrongList = [];
let isRetryMode = false; // 誤答再テスト中は通常テストとして計測しない

const questions = [
/* 1 */ {q:"この標識は、車は通行できないが、歩行者は通行できることを示している。",img:"images/q1.png",a:false,e:"これは「通行止め」の標識です。歩行者、遠隔操作型小型車、車、路面電車のすべてが通行できません。"},
/* 2 */ {q:"この標識は、自動車はもちろん、原動機付自転車や軽車両も通行できない。",img:"images/q2.png",a:true,e:"問題文の通りです。「車両通行止め」の標識です。自動車、原動機付自転車、軽車両（自転車など）を含むすべての車両の通行が禁止されています。歩行者や路面電車は、この標識による規制の対象ではありません。"},
/* 3 */ {q:"この標識は、車両進入禁止で、標識のある方向からは進入できない。",img:"images/q3.png",a:true,e:"問題文の通りです。「車両進入禁止」の標識です。標識が設置されている方向からの車両の進入を禁止しています。主に一方通行の出口などに設置されています。"},
/* 4 */ {q:"この標識のある交差点で右折する一般原動機付自転車は、右折するところまで進行する間、右折の合図をしなくてもよい。",img:"images/q4.png",a:false,e:"これは「一般原動機付自転車の右折方法（二段階）」の標識です。二段階右折する一般原動機付自転車は、交差点の30メートル手前から右折の合図を始め、交差点の向こう側で右に向きを変えるまで合図を続けます。"},
/* 5 */ {q:"この標識のある場所では、8時から20時までの間、駐車が禁止されていることを示している。",img:"images/q5.png",a:true,e:"問題文の通りです。「駐車禁止」の標識です。表示されている8時から20時までの間は、駐車が禁止されています。"},
/* 6 */ {q:"この標識のある場所では、道路の幅が6メートルなければ、駐車してはならないことを示している。",img:"images/q6.png",a:false,e:"これは「駐車余地」の標識です。道路自体の幅が6メートル必要という意味ではなく、駐車した車の右側に6メートル以上の余地を空けなければならないことを示しています。"},
/* 7 */ {q:"この標識のあるところでは、右折することができない。",img:"images/q7.png",a:false,e:"これは「車両横断禁止」の標識です。道路の右側にある店舗や施設などに入るため、道路を横断することは禁止されています。ただし、交差点での右折まで禁止するものではありません。"},
/* 8 */ {q:"この標識のあるところでは、同時に後退も禁止されている。",img:"images/q8.png",a:false,e:"これは「転回禁止」の標識です。車の転回（Uターン）を禁止するもので、後退まで禁止するものではありません。ただし、後退するときも周囲の安全を確認しなければなりません。"},
/* 9 */ {q:"この表示は、前方に交差点があることを示している。",img:"images/q9.png",a:false,e:"これは「横断歩道又は自転車横断帯あり」の道路標示です。前方に横断歩道や自転車横断帯があることを示しています。横断しようとする歩行者や自転車がいる場合は、横断歩道などの直前で一時停止し、その通行を妨げてはいけません。"},
/* 10 */ {q:"この▽印の表示がある方が、前方の交差する道路より優先道路である。",img:"images/q10.png",a:false,e:"これは「前方優先道路」の道路標示です。▽印がある道路ではなく、前方で交差する道路が優先道路であることを示しています。優先道路を通行する車の進行を妨げてはいけません。"},
/* 11 */ {q:"この標識のある道路では、普通乗用自動車以外の自動車は通行できない。",img:"images/q11.png",a:false,e:"これは「自動車専用」の標識です。高速自動車国道または自動車専用道路であることを示しています。普通乗用自動車だけでなく、大型自動車や中型自動車、排気量125ccを超える普通自動二輪車なども通行できます。ただし、一般原動機付自転車、ミニカー、総排気量125cc以下の普通自動二輪車などは通行できません。"},
/* 12 */ {q:"この標識のある道路では、自動二輪車は通行できないが原動機付自転車は通行することができる。",img:"images/q12.png",a:false,e:"これは「二輪の自動車・一般原動機付自転車通行止め」の標識です。大型自動二輪車や普通自動二輪車だけでなく、一般原動機付自転車も通行できません。"},
/* 13 */ {q:"この標識のある道路では、運転経歴にかかわらず、大型自動二輪車及び普通自動二輪車での二人乗り通行を禁止している。",img:"images/q13.png",a:true,e:"問題文の通りです。「大型自動二輪車及び普通自動二輪車二人乗り通行禁止」の標識です。運転経験の年数にかかわらず、この標識のある道路では二人乗りが禁止されています。"},
/* 14 */ {q:"この標識は、路線バス等の優先通行帯を示すもので、路線バスが近づいたときは、ほかの自動車は速やかにその通行帯から出なければならない。",img:"images/q14.png",a:true,e:"「路線バス等優先通行帯」の標識です。ほかの自動車も通行できますが、路線バス等が近づいてきたときは、原則として速やかに通行帯から出なければなりません。また、交通が混雑していて通行帯から出られなくなるおそれがあるときは、最初からその通行帯を通行してはいけません。ただし、左折するために道路の左端に寄る場合や、道路工事などでやむを得ない場合には例外があります。また、進路を変えることができない場合は、無理に進路変更してはいけません。"},
/* 15 */ {q:"この標識のある通行帯では、指定された車以外の車（小型特殊自動車、原動機付自転車、軽車両を除く）は左折や工事などでやむを得ない場合のほかは通行することができない。",img:"images/q15.png",a:true,e:"問題文の通りです。「専用通行帯」の標識です。指定された車が通行するための通行帯で、ほかの自動車は原則として通行できません。ただし、左折するために道路の左端に寄る場合や、道路工事などでやむを得ない場合には通行できます。"},
/* 16 */ {q:"この標識は、歩行者の通行のために設けられた道路であることを示している。",img:"images/q16.png",a:true,e:"「歩行者等専用」の標識です。歩行者の通行のために設けられた道路で、原則として車両の通行は禁止されています。"},
/* 17 */ {q:"この標識のあるところでは、特例特定小型原動機付自転車は通行することができる。",img:"images/q17.png",a:true,e:"「普通自転車等及び歩行者等専用」の標識です。普通自転車や特例特定小型原動機付自転車などが通行できます。ただし、歩道を通行するときは歩行者を優先し、定められた通行方法を守らなければなりません。"},
/* 18 */ {q:"この標識は、車が直進や左折することはできるが、午前8時から午後8時までの間、右折することができないことを示している。",img:"images/q18.png",a:true,e:"問題文の通りです。「指定方向外進行禁止」の標識です。午前8時から午後8時までの間は、矢印で示された直進と左折のみができ、右折することはできません。"},
/* 19 */ {q:"この標識は、普通乗用自動車だけの通行を禁止している。",img:"images/q19.png",a:false,e:"これは「二輪の自動車以外の自動車通行止め」の標識です。普通乗用自動車だけでなく、トラックなどの四輪・三輪の自動車も通行できません。二輪の自動車や原動機付自転車は、この標識による規制の対象ではありません。"},
/* 20 */ {q:"この標識のあるところでは、大型貨物自動車や大型特殊自動車は通行できない。",img:"images/q20.png",a:true,e:"問題文の通りです。「大型貨物自動車等通行止め」の標識です。大型貨物自動車、特定中型貨物自動車、大型特殊自動車の通行が禁止されています。"},
/* 21 */ {q:"この標識のあるところでは、車両総重量3,000キログラムの貨物自動車は通行できないことを示している。",img:"images/q21.png",a:false,e:"これは「特定の最大積載量以上の貨物自動車等通行止め」の標識です。この場合、最大積載量3,000キログラム以上の貨物自動車などが通行禁止の対象になります。車両総重量と最大積載量は異なります。"},
/* 22 */ {q:"この表示は、立入り禁止部分であることを示している。",img:"images/q22.png",a:true,e:"問題文の通りです。「立入り禁止部分」の道路標示です。車は、この標示で囲まれた部分に入ってはいけません。"},
/* 23 */ {q:"この表示は、停止禁止部分であることを示している。",img:"images/q23.png",a:true,e:"問題文の通りです。「停止禁止部分」の道路標示です。前方の交通状況により、この部分で停止するおそれがあるときは、その中に入ってはいけません。"},
/* 24 */ {q:"この白の二本線で示された路側帯は、車はその中に入って駐車をしてもよい。",img:"images/q24.png",a:false,e:"これは「歩行者用路側帯」です。白い実線2本で区画された路側帯で、車はその中に入って駐車や停車をすることはできません。"},
/* 25 */ {q:"この表示の路側帯に入って、駐車や停車をすることはできない。",img:"images/q25.png",a:true,e:"問題文の通りです。「駐停車禁止路側帯」です。白い実線と破線で区画された路側帯で、車はその中に入って駐車や停車をすることはできません。"},
/* 26 */ {q:"この標識は、その他の危険を表しており、この先警戒すべきことがあることを示している。",img:"images/q26.png",a:true,e:"問題文の通りです。「その他の危険」の警戒標識です。ほかの警戒標識では表せない危険が前方にあることを示しています。補助標識によって危険の内容が示される場合もあります。"},
/* 27 */ {q:"この標識は、この先で左から道路が合流してくることを示している。",img:"images/q27.png",a:true,e:"問題文の通りです。「合流交通あり」の警戒標識です。前方で左側から道路が合流することを示しています。合流してくる車に注意して通行しましょう。"},
/* 28 */ {q:"この表示は、道路中央寄り右側部分にはみ出して追い越すときは、対向車に注意しなければならないことを示している。",img:"images/q28.png",a:false,e:"これは「追越しのための右側部分はみ出し通行禁止」の道路標示です。前の車を追い越すために、道路の右側部分にはみ出して通行することは禁止されています。"},
/* 29 */ {q:"この標識は、自動車と一般原動機付自転車の最高速度が時速50キロメートルであることを示している。",img:"images/q29.png",a:false,e:"これは「最高速度」の標識です。最高速度が時速50キロメートルと表示されていても、一般原動機付自転車は法定速度の時速30キロメートルを超えて運転することはできません。"},
/* 30 */ {q:"この補助標識は、本標識が表示する交通規制の終わりを表している。",img:"images/q30.png",a:true,e:"問題文の通りです。「終わり」の補助標識です。本標識による交通規制が、ここで終了することを示しています。"},
/* 31 */ {q:"これは、左折可を示す表示板である。",img:"images/q31.png",a:false,e:"これは「一方通行」の標識です。車は矢印で示された方向にしか通行できず、反対方向への通行は禁止されています。"},

];


// 各問題に元の問題番号を保存
questions.forEach((q, i) => q.no = i + 1);
const questionsMaster = [...questions];


function progressMarkup(){
  return `<div class="quiz-progress"><div class="quiz-progress-label"><span>${isRetryMode ? '再テスト' : 'テスト'}：現在${current + 1}問目／全${questions.length}問</span><span>回答済み ${current}問</span></div><progress value="${current}" max="${questions.length}" aria-label="回答済みの問題数">${current}／${questions.length}</progress></div>`;
}

function showQuestion(){
  if(current === 0) window.scrollTo(0, 0);
  const q = questions[current];
  const imgHtml = q.img ? `<img src="${q.img}" class="question-img" alt="第${q.no}問の標識・図">` : "";
  container.innerHTML = `<section class="question-screen">${progressMarkup()}
    <p class="question-no">【第 ${q.no} 問】</p>
    <p class="question-text">${q.q}</p>
    ${imgHtml}
    <div class="answer-choices">
      <button aria-label="○：正しい" onclick="answer(true)">○</button>
      <button aria-label="×：誤り" onclick="answer(false)">×</button>
    </div>
    <a class="menu-link" href="https://at21or7.github.io/">← 問題メニューに戻る</a>
  </section>`;
}

function answer(val){
  const q = questions[current];
  const isCorrect = (val === q.a);

  if(isCorrect){
    score++;
  }else{
    // 間違えた問題だけ記録する
    wrongList.push({
      no: q.no,
      q: q.q,
      e: q.e,
      img: q.img
    });
  }

  current++;
  current < questions.length ? showQuestion() : showResult();
}

function showResult(){
  const isFullTest = !isRetryMode && questions.length === questionsMaster.length;
  const passLine = isFullTest ? PASS_LINE : questions.length;

  // 通常の50問完了・合格のみGA4に送信。誤答再テストは対象外。
  if (isFullTest && typeof gtag === "function") {
    gtag("event", "quiz_complete", { quiz_type: "signs_markings", score: score });
    if (score >= PASS_LINE) {
      gtag("event", "quiz_pass", { quiz_type: "signs_markings", score: score });
    }
  }

  const passed = score >= passLine;
  const rate = Math.round(score / questions.length * 100);
  const status = isFullTest ? (passed ? "合格" : "不合格") : (passed ? "復習クリア" : "もう一度復習しましょう");
  const message = wrongList.length
    ? `間違えた${wrongList.length}問を復習して、${isFullTest ? "合格" : "全問正解"}を目指しましょう。`
    : "全問正解です！よくできました。";
  const actions = `
    <div class="result-actions">
      ${wrongList.length ? `<button class="action-btn" onclick="retryWrong()">間違えた${wrongList.length}問を再テスト</button>` : ""}
      <button class="action-btn ${wrongList.length ? "secondary" : ""}" onclick="restartAll()">最初から50問に挑戦</button>
    </div>`;
  let html = `
    <section class="result-summary" aria-labelledby="result-title">
      <h2 id="result-title" tabindex="-1">${isFullTest ? "テスト結果" : "再テスト結果"}</h2>
      <p class="result-status ${passed ? "passed" : ""}">${status}</p>
      <p class="result-score">${score}<small> / ${questions.length}点</small></p>
      <p class="result-meta">${isFullTest ? `合格ライン ${PASS_LINE}点` : "再テストの目標：全問正解"}<br>正答率 ${rate}%${!passed ? `・${isFullTest ? "合格" : "全問正解"}まであと${passLine - score}点` : ""}</p>
      <p class="result-message">${message}</p>
    </section>
    ${actions}
  `;
  if(wrongList.length){
    html += `<section class="review"><h3>間違えた問題の解説 <span>${wrongList.length}問</span></h3>`;
    wrongList.forEach(w=>{
      const correctAnswer = questionsMaster.find(q => q.no === w.no).a;
      html += `
        <article class="review-card">
          <h4>第${w.no}問</h4>
          <p>${w.q}</p>
          ${w.img ? `<img src="${w.img}" class="question-img" alt="第${w.no}問の標識・標示">` : ""}
          <div class="answer-label">正解：${correctAnswer ? "○" : "×"}</div>
          <p class="explanation"><strong>解説</strong>${w.e}</p>
        </article>`;
    });
    html += `</section>`;
  }
  html += `<a class="menu-link" href="https://at21or7.github.io/">← 問題メニューに戻る</a><a class="school-link" href="https://murakami-ds.com/">村上中央自動車学校 公式サイトへ →</a>`;

  container.innerHTML = html;
  document.getElementById("result-title").focus();
  window.scrollTo(0, 0);
}

function retryWrong(){
  const retryNumbers = wrongList.map(w => w.no);
  const retryQuestions = questionsMaster.filter(q => retryNumbers.includes(q.no));

  questions.length = 0;
  retryQuestions.forEach(q => questions.push(q));

  current = 0;
  score = 0;
  wrongList = [];
  isRetryMode = true;

  showQuestion();
}

function restartAll(){
  questions.length = 0;
  questionsMaster.forEach(q => questions.push(q));

  current = 0;
  score = 0;
  wrongList = [];
  isRetryMode = false;

  showQuestion();
}

showQuestion();
</script>

</body>
</html>
