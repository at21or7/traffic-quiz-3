<h1><span class="school-name">村上中央自動車学校</span><span class="desktop-heading">　学科問題</span><span class="mobile-heading">標識・標示問題50問</span></h1>
<p style="text-align:center;color:#555;font-size:28px;" class="quiz-subtitle"><span class="desktop-subtitle">
標識・標示の問題（全50問）
</span><span class="mobile-subtitle">○×形式・全50問・合格ライン47点</span></p>

<div id="container"></div>

<script>
const container = document.getElementById("container");
const PASS_LINE = 47;

let current = 0;
let score = 0;
let wrongList = [];
let isRetryMode = false; // 誤答再テスト中は通常テストとして計測しない

const questions = [
/* 1 */ {q:"この標識は、車は通行できないが、歩行者は通行できることを示している。",img:"images/q1.png",a:false,e:"これは「通行止め」の標識です。歩行者、遠隔操作小型車、車、路面電車のすべてが通行できません。"},
/* 2 */ {q:"この標識は、自動車はもちろん、原動機自動車や軽車両も通行できない。",img:"images/q2.png",a:true,e:"問題文の通りです。「車両通行止め」の標識」です。歩行者や路面電車は通行できるが、自動車、原動機付自転車、軽車両（自転車など）を含む全ての車両の通行が禁止です。"},
/* 3 */ {q:"この標識は、車両進入禁止で、標識のある方向からは進入できない。",img:"images/q3.png",a:true,e:"問題文の通りです。「車両進入禁止」の標識です。指定された方向からの車両（自動車、原動機付自転車、軽車両）の進入を禁止する標識です。主に一方通行の出口に設置され、逆走防止の目的があります。"},
/* 4 */ {q:"この標識のある交差点で右折する原動機付自転車は、右折するところまで進行する間、右折の合図をしなくてもよい。",img:"images/q4.png",a:false,e:"「一般原動機付自転車の右折方法（二段階）」の標識です。二段階右折する原付は、交差点の30ｍ手前から、右に向きを変えるところまで、右折の合図をします。"},
/* 5 */ {q:"この標識のある場所では、８時から２０時までの間、駐車が禁止されていることを示している。",img:"images/q5.png",a:true,e:"問題文の通りです。「駐車禁止」の標識です。標識内の数字（8-20）は規制が適用される時間を示しています。"},
/* 6 */ {q:"この標識のある場所では、道路の幅が６メートルなければ駐車してはならないことを示している。",img:"images/q6.png",a:false,e:"これは「駐車余地」の標識です。道路自体の幅が6メートルなければいけない、という意味ではなく。車の右側に６メートルの余地がなければ駐車できないという意味です。"},
/* 7 */ {q:"この標識のあるところでは、右折することができない",img:"images/q7.png",a:false,e:"これは「車両横断禁止」の標識です。道路外（右側の店舗や施設）に入るための道路横断を禁止する標識です。交通量が多い場所で事故防止のために設置され、施設へ直接右折して入ることはできませんが、交差点を右折することはできます。"},
/* 8 */ {q:"この標識のあるところでは、同時に後退も禁止されている。",img:"images/q8.png",a:false,e:"これは「転回禁止」の標識です。歩行者・他車の通行を妨げる危険な場所で、車のUターンを禁止する標識です。後退はできます。"},
/* 9 */ {q:"この表示は、前方に交差点があることを示している。",img:"images/q9.png",a:false,e:"これは「横断歩道または自転車横断帯あり」の表示です。このマークを見たら、横断歩道に歩行者等が待機している、または渡ろうとしている場合は、必ず手前で一時停止して歩行者等の横断を妨げないようにしなければなりません。"},
/*10 */ {q:"この▽印の表示がある方が、前方の交差する道路より優先道路である。",img:"images/q10.png",a:false,e:"これは「前方優先道路」の表示です。▽印の表示がない方が優先道路です。▽印の表示がある方を通行している車は、交差点の状況に応じて、他の車両や歩行者に注意し、安全な速度と方法で走行します。優先道路を走行するときでも、周囲の状況を確認して、必要に応じて徐行や一時停止をしましょう。"},

/* 11 */ {q:"この標識のある道路では、普通乗用自動車以外の自動車は通行できない。",img:"images/q11.png",a:false,e:"これは「自動車専用」の標識です。高速自動車国道または自動車専用道路であることを示し、ミニカー、一般原動機付自転車,125cc以下または定格出力1.00kw以下の普通自動二輪車は通行できません。"},
/* 12 */ {q:"この標識のある道路では、自動二輪車は通行できないが原動機付自転車は通行することができる。",img:"images/q12.png",a:false,e:"これは「二輪の自動車・原動機付き自転車通行止め」の標識です。自動二輪車の他に原動機付自転車も規制の対象になります。"},
/* 13 */ {q:"この標識のある道路では、運転経歴にかかわらず、大型自動二輪車及び普通自動二輪車での、二人乗り通行を禁止している。",img:"images/q13.png",a:true,e:"問題文の通りです。「大型自動二輪車及び普通自動二輪車二人乗り通行禁止」の標識です。"},
/* 14 */ {q:"この標識は、路線バス等の優先通行帯を示すもので、路線バスが近づいたときは、ほかの自動車は速やかにその通行帯から出なければならない。",img:"images/q14.png",a:true,e:"問題文の通りです。「路線バス等優先通行帯」の標識です。路線バスやスクールバスなどの通行を優先させるための車線で、一般車両も通行できますが、バスが近づいたら速やかに退避する必要があります。"},
/* 15 */ {q:"この標識のある通行帯では、指定された車以外の車（小型特殊自動車、原動機付自転車、軽車両を除く）は左折や工事などでやむを得ない場合のほかは通行することができない。",img:"images/q15.png",a:true,e:"問題文の通りです。「専用通行帯」の標識です。路線バスや通学・通園バスなどが優先的に走行するための通行帯です。一般車は原則として通行禁止です。"},
/* 16 */ {q:"この標識は、歩行車だけの通行のために設けられた道路を示している。",img:"images/q16.png",a:true,e:"問題文の通りです。「歩行者専用道路」の標識です。歩行者の安全確保のために車両（軽車両を含む）の通行が禁止されている道路です。"},
/* 17 */ {q:"この標識のあるところでは、特例特定小型原動機付自転車は通行することができる。",img:"images/q17.png",a:true,e:"問題文の通りです。「普通自転車及び歩行者等専用」の標識です。普通自転車と特定小型原動機付自転車（電動キックボードなど）、そして歩行者のみが通行できる道路や区間を示し、他の車両は禁止され、歩行者が優先される場所です。"},
/* 18 */ {q:"この標識は、車が直進や左折することはできるが、午前８時から午後８時までの間、右折することができないことを示している。",img:"images/q18.png",a:true,e:"問題文の通りです。『指定方向外進行禁止」の標識です。白矢印で示された方向以外への車両の進行を禁止する標識で、交差点などで矢印の示す方向（右折・左折・直進など）にしか進めないことを意味します。  "},
/* 19 */ {q:"この標識は、普通乗用自動車だけの通行を禁止している。",img:"images/q19.png",a:false,e:"これは「二輪の自動車以外の自動車通行止め」の標識です。バイク（大型二輪・普通二輪・原付）は通行できるが、乗用車やトラックなどの四輪車・三輪車は通行できない標識です。"},
/* 20 */ {q:"この標識のあるところでは、最大積載量2.000キログラムの貨物自動車は通行してもよい。",img:"images/q20.png",a:true,e:"問題文の通りです。大型貨物自動車と特定中型貨物自動車、大型特殊自動車は通行できません。最大積載量2.000キログラムの貨物自動車は準中型自動車のため通行できます。"},
/* 21 */ {q:"この標識のあるところでは、車両総重量3.000キログラムの貨物自動車は通行できないことを示している。",img:"images/q21.png",a:false,e:"「特定の最大積載量以上の貨物自動車等通行止め」の標識です。この場合最大積載量3.000キログラム以上の貨物自動車と大型特殊自動車は通行できません。車両総重量と最大積載量を混同しないよう、十分に注意しましょう。"},
/* 22 */ {q:"この表示は、立ち入り禁止部分であることを示している。",img:"images/q22.png",a:true,e:"問題文の通りです。車はこの表示の中に入ってはいけません。"},
/* 23 */ {q:"この表示は、停止禁止部分であることを示している。",img:"images/q23.png",a:true,e:"問題文の通りです。前方の状況により、この表示の中で停止するおそれがあるときは、この中に入ってはいけません。"},
/* 24 */ {q:"この白の二本線で示された路側帯は、車はその中に入って駐車をしてもよい。",img:"images/q24.png",a:false,e:"これは「歩行者専用路側帯」です。歩道のない道路などで、白い実線が2本引かれている部分のことで、歩行者のみが通行でき、自転車を含む全ての車両（自動車、バイク、原付など）の通行や駐停車が禁止されています。"},
/* 25 */ {q:"この表示の路側帯に入って、駐車や停車をすることはできない。",img:"images/q25.png",a:true,e:"問題文の通りです。「駐停車禁止路側帯」です。白の実線と白の破線で区画された道路標示で、自動車や原付がこのエリアに入って駐車・停車することが禁じられた場所です。"},
/* 26 */ {q:"この標識は、その他の危険を表しており、この先警戒すべきことがあることを示している。",img:"images/q26.png",a:true,e:"問題文の通りです。「その他の危険」ありの標識です。これ以外の警戒標識では表示（表現）できない等の場合において、この先で車両の運転上注意が必要であることを指します。必要に応じて「補助標識」との組み合わせにより設置されています。"},

];


// 各問題に元の問題番号を保存
questions.forEach((q, i) => q.no = i + 1);
const questionsMaster = [...questions];


function progressMarkup(){
  return `<div class="quiz-progress"><div class="quiz-progress-label"><span>${isRetryMode ? '再テスト' : 'テスト'}：現在${current + 1}問目／全${questions.length}問</span><span>回答済み ${current}問</span></div><progress value="${current}" max="${questions.length}" aria-label="回答済みの問題数">${current}／${questions.length}</progress></div>`;
}

function showQuestion(){
  if(current === 0) window.scrollTo(0, 0);
  const q = questions[current];
  let imgHtml = q.img ? `<img src="${q.img}" class="question-img" alt="第${q.no}問の標識・標示">` : "";
  container.innerHTML = `<section class="question-screen">${progressMarkup()}
    <p style="font-size:36px;font-weight:bold;color:#003366;" class="question-no">【第 ${q.no} 問】</p>
    <p style="font-size:clamp(32px,8.5vw,42px);line-height:1.8;font-weight:bold;" class="question-text">${q.q}</p>
    ${imgHtml}
    <div class="answer-choices"><button aria-label="○：正しい" onclick="answer(true)">○</button>
    <button aria-label="×：誤り" onclick="answer(false)">×</button></div>
  <a class="menu-link" href="https://at21or7.github.io/">← 問題メニューに戻る</a></section>`;
}

function answer(val){
  const q = questions[current];
  const isCorrect = (val === q.a);

  if(isCorrect){
    score++;
  }else{
    // 間違えた問題だけ記録する
    wrongList.push({
      no: q.no,
      q: q.q,
      e: q.e,
      img: q.img
    });
  }

  current++;
  current < questions.length ? showQuestion() : showResult();
}

function showResult(){
  const isFullTest = !isRetryMode && questions.length === questionsMaster.length;
  const passLine = isFullTest ? PASS_LINE : questions.length;

  // 通常の50問完了・合格のみGA4に送信。誤答再テストは対象外。
  if (isFullTest && typeof gtag === "function") {
    gtag("event", "quiz_complete", { quiz_type: "signs_markings", score: score });
    if (score >= PASS_LINE) {
      gtag("event", "quiz_pass", { quiz_type: "signs_markings", score: score });
    }
  }

  const passed = score >= passLine;
  const rate = Math.round(score / questions.length * 100);
  const status = isFullTest ? (passed ? "合格" : "不合格") : (passed ? "復習クリア" : "もう一度復習しましょう");
  const message = wrongList.length
    ? `間違えた${wrongList.length}問を復習して、${isFullTest ? "合格" : "全問正解"}を目指しましょう。`
    : "全問正解です！よくできました。";
  const actions = `
    <div class="result-actions">
      ${wrongList.length ? `<button class="action-btn" onclick="retryWrong()">間違えた${wrongList.length}問を再テスト</button>` : ""}
      <button class="action-btn ${wrongList.length ? "secondary" : ""}" onclick="restartAll()">最初から50問に挑戦</button>
    </div>`;
  let html = `
    <section class="result-summary" aria-labelledby="result-title">
      <h2 id="result-title" tabindex="-1">${isFullTest ? "テスト結果" : "再テスト結果"}</h2>
      <p class="result-status ${passed ? "passed" : ""}">${status}</p>
      <p class="result-score">${score}<small> / ${questions.length}点</small></p>
      <p class="result-meta">${isFullTest ? `合格ライン ${PASS_LINE}点` : "再テストの目標：全問正解"}<br>正答率 ${rate}%${!passed ? `・${isFullTest ? "合格" : "全問正解"}まであと${passLine - score}点` : ""}</p>
      <p class="result-message">${message}</p>
    </section>
    ${actions}
  `;
  if(wrongList.length){
    html += `<section class="review"><h3>間違えた問題の解説 <span>${wrongList.length}問</span></h3>`;
    wrongList.forEach(w=>{
      const correctAnswer = questionsMaster.find(q => q.no === w.no).a;
      html += `
        <article class="review-card">
          <h4>第${w.no}問</h4>
          <p>${w.q}</p>
          ${w.img ? `<img src="${w.img}" class="question-img" alt="第${w.no}問の標識・標示">` : ""}
          <div class="answer-label">正解：${correctAnswer ? "○" : "×"}</div>
          <p class="explanation"><strong>解説</strong>${w.e}</p>
        </article>`;
    });
    html += `</section>${actions}`;
  }
  html += `<a class="menu-link" href="https://at21or7.github.io/">← 問題メニューに戻る</a><a class="school-link" href="https://murakami-ds.com/">村上中央自動車学校 公式サイトへ →</a>`;

  container.innerHTML = html;
  document.getElementById("result-title").focus();
  window.scrollTo(0, 0);
}

function retryWrong(){
  const retryNumbers = wrongList.map(w => w.no);
  const retryQuestions = questionsMaster.filter(q => retryNumbers.includes(q.no));

  questions.length = 0;
  retryQuestions.forEach(q => questions.push(q));

  current = 0;
  score = 0;
  wrongList = [];
  isRetryMode = true;

  showQuestion();
}

function restartAll(){
  questions.length = 0;
  questionsMaster.forEach(q => questions.push(q));

  current = 0;
  score = 0;
  wrongList = [];
  isRetryMode = false;

  showQuestion();
}

showQuestion();
</script>
